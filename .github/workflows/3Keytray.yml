name: Build Keyball61 Right Hand Only

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/qmk/qmk_cli:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Disable git safe directory checks
        run: git config --global --add safe.directory '*'

      - name: Fix QMK CLI & Source Code Internal Python Bug
        run: |
          # 1. コンテナ側のシステムPythonライブラリのバグを修正
          SYS_MATH_PY="/usr/local/lib/python3.14/site-packages/qmk/math.py"
          [ -f "$SYS_MATH_PY" ] && sed -i 's/ast.Num/ast.Constant/g; s/node.n/node.value/g' "$SYS_MATH_PY"
          
          # 2. リポジトリのソースコード側（lib/python/qmk/math.py）のバグを強制修正
          REPO_MATH_PY="lib/python/qmk/math.py"
          [ -f "$REPO_MATH_PY" ] && sed -i 's/ast.Num/ast.Constant/g; s/node.n/node.value/g' "$REPO_MATH_PY"

      - name: Configure Hardware (Right Hand & GP17)
        run: |
          # 右手単独動作のための設定を追加
          echo "#define MASTER_RIGHT" >> keyboards/keyball/keyball61/config.h
          
          # COL3をGP15からGP17へ変更したピン配列を上書き
          echo "#define MATRIX_COL_PINS { GP20, GP19, GP18, GP17, GP14, GP13 }" >> keyboards/keyball/keyball61/config.h

      - name: Compile Keyball61
        run: qmk compile -kb keyball/keyball61 -km default
