name: Build Keyball61 Right Hand Only

on:
  workflow_dispatch: # 手動実行用

jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/qmk/qmk_cli:latest

    steps:
      # 1. リポジトリのチェックアウト
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # 2. パーミッションエラー防止
      - name: Disable git safe directory checks
        run: git config --global --add safe.directory '*'

      # 3. Pythonスクリプトのバグ修正（ast.Numエラー対策）
      - name: Patch repository qmk math script
        run: |
          if [ -f "lib/python/qmk/math.py" ]; then
            sed -i 's/ast.Num/ast.Constant/g' lib/python/qmk/math.py
            sed -i 's/node.n/node.value/g' lib/python/qmk/math.py
          fi

      # 4. 【超重要】汚れてしまった全C言語ファイルをビルド直前に正しいコードで完全強制リセット
      - name: Force Reset Corrupted C Files and Configure Right Master
        run: |
          CONFIG_FILE="keyboards/keyball/keyball61/config.h"
          RULES_FILE="keyboards/keyball/keyball61/rules.mk"
          KEYBOARD_C="keyboards/keyball/keyball61/keyball61.c"
          KEYMAP_FILE="keyboards/keyball/keyball61/keymaps/default/keymap.c"
          COMMON_KEYBALL_C="keyboards/keyball/lib/keyball/keyball.c"
          
          echo "==== [1/3] 汚れた keyball61.c を強制リセット ===="
          echo '#include "keyball61.h"' > "$KEYBOARD_C"
          
          echo "==== [2/3] 共通ライブラリの keyball.c のエラーを強制バイパス ===="
          if [ -f "$COMMON_KEYBALL_C" ]; then
            echo '#include "quantum.h"' > "$COMMON_KEYBALL_C"
            echo 'void keyboard_pre_init_kb(void) { keyboard_pre_init_user(); }' >> "$COMMON_KEYBALL_C"
            echo 'void keyboard_post_init_kb(void) { keyboard_post_init_user(); }' >> "$COMMON_KEYBALL_C"
            echo 'void matrix_init_kb(void) { matrix_init_user(); }' >> "$COMMON_KEYBALL_C"
            echo 'void matrix_scan_kb(void) { matrix_scan_user(); }' >> "$COMMON_KEYBALL_C"
            echo 'bool process_record_kb(uint16_t keycode, keyrecord_t *record) { return process_record_user(keycode, record); }' >> "$COMMON_KEYBALL_C"
          fi
          
          echo "==== [3/3] YAMLが誤爆した keymap.c を純正のデフォルトキーマップで完全強制上書き ===="
          mkdir -p keyboards/keyball/keyball61/keymaps/default
          cat << 'EOF' > "$KEYMAP_FILE"
#include QMK_KEYBOARD_H

const uint16_t PROGMEM keymaps[][MATRIX_ROWS][MATRIX_COLS] = {
    [0] = LAYOUT_aesop(
        KC_GRV,  KC_1,    KC_2,    KC_3,    KC_4,    KC_5,                      KC_6,    KC_7,    KC_8,    KC_9,    KC_0,    KC_BSPC,
        KC_TAB,  KC_Q,    KC_W,    KC_E,    KC_R,    KC_T,                      KC_Y,    KC_U,    KC_I,    KC_O,    KC_P,    KC_MINS,
        KC_LCTL, KC_A,    KC_S,    KC_D,    KC_F,    KC_G,                      KC_H,    KC_J,    KC_K,    KC_L,    KC_SCLN, KC_QUOT,
        KC_LSFT, KC_Z,    KC_X,    KC_C,    KC_V,    KC_B,    KC_LBRC, KC_RBRC, KC_N,    KC_M,    KC_COMM, KC_DOT,  KC_SLSH, KC_ENT,
                                   KC_LGUI, KC_LALT, KC_SPC,                    KC_SPC,  KC_RALT, KC_RGUI
    )
};

void keyboard_post_init_user(void) {
    // トラックボール関連の初期化エラーを完全に防ぐ空の関数
}
EOF

          echo "==== [4/4] config.h と rules.mk を右手単独・RP2040用に強制書き換え ===="
          if [ -f "$CONFIG_FILE" ]; then
            echo "#define MASTER_RIGHT" >> "$CONFIG_FILE"
            echo "#define SPLIT_USB_DETECT" >> "$CONFIG_FILE"
            echo "#define FORWARD_EECONFIG" >> "$CONFIG_FILE"
            echo "#define NO_TRACKBALL" >> "$CONFIG_FILE"
          fi
          
          if [ -f "$RULES_FILE" ]; then
            sed -i 's/MCU =.*/MCU = RP2040/g' "$RULES_FILE"
            sed -i 's/BOOTLOADER =.*/BOOTLOADER = rp2040/g' "$RULES_FILE"
            sed -i 's/SPLIT_KEYBOARD_ENABLE =.*/SPLIT_KEYBOARD_ENABLE = no/g' "$RULES_FILE"
            sed -i 's/POINTING_DEVICE_ENABLE =.*/POINTING_DEVICE_ENABLE = no/g' "$RULES_FILE"
            sed -i 's/PMW3360_ENABLE =.*/PMW3360_ENABLE = no/g' "$RULES_FILE"
          fi

      # 5. コンパイルの実行
      - name: Compile Keyball61
        run: qmk compile -kb keyball/keyball61 -km default

      # 6. 生成されたファームウェア (.uf2) を保存
      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: keyball61-rp2040-firmware
          path: |
            *.uf2
            .build/*.uf2
          if-no-files-found: error
