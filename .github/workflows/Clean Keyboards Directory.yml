name: Clean Keyboards Directory

on:
  workflow_dispatch: # 手動実行用

# GitHub Actionsに書き込み権限を明示的に付与
permissions:
  contents: write

jobs:
  clean-up:
    runs-on: ubuntu-latest

    steps:
      # 1. リポジトリをチェックアウト
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: keyball61-rp2040
          fetch-depth: 1

      # 2. Git コマンドを使って keyball 以外を確実に削除
      - name: Remove keyboards except Keyball via Git
        run: |
          cd keyboards
          
          # 大文字小文字を区別せずにマッチング
          shopt -s nocaseglob
          
          # keyboards 直下のディレクトリ・ファイルをループ
          for item in *; do
            # 名前に "keyball" が含まれていない場合は Git から強制削除
            if [[ "$item" != *keyball* ]]; then
              echo "Git Removing: $item"
              git rm -rf "$item"
            fi
          done
          
          # 念のため、Git管理外の残骸も完全に消去
          git clean -fdx

      # 3. 変更をコミットしてプッシュ
      - name: Commit and Push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # 削除（変更）をすべてステージング
          git add -A
          
          if ! git diff-index --quiet HEAD; then
            git commit -m "Force remove all keyboards except Keyball"
            git push origin keyball61-rp2040
          else
            echo "No changes to commit"
          fi
