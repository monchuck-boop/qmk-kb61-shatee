name: Build Keyball61 Right Single Workaround

on:
  workflow_dispatch: # 手動実行用

jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/qmk/qmk_cli:latest

    steps:
      # 1. リポジトリのチェックアウト
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # 2. 安全なディレクトリ設定
      - name: Disable git safe directory checks
        run: git config --global --add safe.directory '*'

      # 3. Pythonのバグ修正（ast.Numエラー対策）
      - name: Patch repository qmk math script
        run: |
          if [ -f "lib/python/qmk/math.py" ]; then
            sed -i 's/ast.Num/ast.Constant/g' lib/python/qmk/math.py
            sed -i 's/node.n/node.value/g' lib/python/qmk/math.py
          fi

      # 4. 【確定】右手をマスターに固定し、分割通信のバグを完全に切る設定
      - name: Configure Right Master Single Mode
        run: |
          CONFIG_FILE="keyboards/keyball/keyball61/config.h"
          RULES_FILE="keyboards/keyball/keyball61/rules.mk"
          
          # 右手単独起動を強制し、左手への通信待ち（フリーズ）を防止
          if [ -f "$CONFIG_FILE" ]; then
            echo "Setting MASTER_RIGHT and disabling split handshake..."
            echo "#define MASTER_RIGHT" >> "$CONFIG_FILE"
            # 左右通信のタイムアウトによる親指フリーズを防ぐため、通信を完全にカット
            echo "#define FORWARD_EECONFIG" >> "$CONFIG_FILE"
          fi
          
          # 分割機能を完全にオフにし、右手側を「1枚の完結したキーボード」としてQMKに認識させる
          if [ -f "$RULES_FILE" ]; then
            echo "Disabling SPLIT_KEYBOARD_ENABLE in rules.mk..."
            if grep -q "SPLIT_KEYBOARD_ENABLE" "$RULES_FILE"; then
              sed -i 's/SPLIT_KEYBOARD_ENABLE =.*/SPLIT_KEYBOARD_ENABLE = no/g' "$RULES_FILE"
            else
              echo "SPLIT_KEYBOARD_ENABLE = no" >> "$RULES_FILE"
            fi
          fi

      # 5. コンパイルの実行
      - name: Compile Keyball61
        run: qmk compile -kb keyball/keyball61 -km default

      # 6. ファームウェアの保存
      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: keyball61-right-fixed
          path: |
            *.uf2
            *.hex
            *.bin
          if-no-files-found: error
