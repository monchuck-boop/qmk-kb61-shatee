name: Build Keyball61 via Container

on:
  workflow_dispatch: # 手動実行用
  push:
    branches:
      - keyball61-rp2040

jobs:
  build:
    runs-on: ubuntu-latest
    # QMK公式の隔離された安全なコンテナを使用（システム側のPython3.14の影響を完全にシャットアウト）
    container: ghcr.io/qmk/qmk_cli:latest

    steps:
      # 1. リポジトリのチェックアウト
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # 2. ディレクトリのパーミッションエラーを防ぐ設定
      - name: Disable git safe directory checks
        run: git config --global --add safe.directory '*'

      # 3. 万が一に備えて、リポジトリ内の古いPythonスクリプトのバグ部分も強制自動修正
      - name: Patch repository qmk math script
        run: |
          if [ -f "lib/python/qmk/math.py" ]; then
            sed -i 's/ast.Num/ast.Constant/g' lib/python/qmk/math.py
            sed -i 's/node.n/node.value/g' lib/python/qmk/math.py
          fi

      # 4. コンテナ内部のQMKで安全にコンパイル
      - name: Compile Keyball61
        run: qmk compile -kb keyball/keyball61 -km default

      # 5. コンパイルされたファームウェア (.uf2) をダウンロード可能にする
      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: keyball61-firmware
          path: |
            *.uf2
            *.hex
            *.bin
          if-no-files-found: error
