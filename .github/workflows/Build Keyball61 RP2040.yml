name: Build Keyball61 RP2040

on:
  workflow_dispatch: # 手動実行用
  push:
    branches:
      - keyball61-rp2040
    paths:
      - 'keyboards/keyball/**'

jobs:
  build:
    runs-on: ubuntu-latest
    # 【修正箇所】最新(latest)ではなく、安定版のバージョンを指定して環境の衝突を防ぎます
    container: qmkfm/qmk_cli:0.26.11

    steps:
      # 1. リポジトリのチェックアウト
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # 2. QMK環境のセットアップとクリーン
      - name: Setup QMK Environment
        run: |
          qmk setup -y
          qmk clean

      # 3. Keyball61 (RP2040) のコンパイル
      - name: Compile Keyball61
        run: |
          qmk compile -kb keyball/keyball61 -km default

      # 4. コンパイルされたファームウェア (.uf2) をArtifactとして保存
      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: keyball61-rp2040-firmware
          path: |
            *.uf2
            *.hex
            *.bin
          if-no-files-found: error
